# Local Postgres for development — matches DATABASE_URL in .env.example.
# `docker compose up -d` → `npx prisma migrate deploy` → `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abetConnect
      POSTGRES_PASSWORD: abetConnect
      POSTGRES_DB: abetConnect
    ports:
      - "5432:5432"
    volumes:
      - abetConnect-pg:/var/lib/postgresql/data

volumes:
  abetConnect-pg:
